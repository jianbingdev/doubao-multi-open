<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>豆包多开管理器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      overflow: hidden;
      user-select: none;
    }
    .sidebar {
      width: 260px; min-width: 260px;
      background: #fff;
      border-right: 1px solid #e3e3e8;
      display: flex; flex-direction: column;
      height: 100vh;
    }
    .sidebar-header { padding: 14px 14px 10px; border-bottom: 1px solid #eeeef2; }
    .sidebar-header h1 { font-size: 15px; font-weight: 600; }
    .sidebar-header p { font-size: 11px; color: #86868b; margin-top: 3px; }
    .btn-add {
      margin: 12px 14px 6px; padding: 9px 0;
      background: #1d63d8; color: #fff; border: none; border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }
    .btn-add:hover { background: #174ec0; }
    .btn-add:disabled { background: #b8b8be; cursor: wait; }
    .btn-check {
      margin: 0 14px 8px; padding: 7px 0;
      width: calc(100% - 28px);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      background: #fff; color: #1d63d8;
      border: 1px solid #c5d9f7; border-radius: 8px;
      font-size: 12px; cursor: pointer;
    }
    .btn-check:hover { background: #f2f7ff; }
    .btn-check:disabled { color: #b8b8be; border-color: #e3e3e8; background: #fafafa; cursor: wait; }
    .account-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .account-item {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 10px; margin: 3px 0;
      border-radius: 8px; font-size: 13px; cursor: pointer;
      background: #f7f7f9; border: 1px solid transparent;
    }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      flex-shrink: 0; position: relative;
    }
    .avatar::after {
      content: ''; position: absolute; right: -1px; bottom: -1px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #c7c7cc; border: 2px solid #fff;
    }
    .account-item[data-badge="online"] .avatar::after { background: #34c759; }
    .account-item[data-badge="pending"] .avatar::after { background: #ff9f0a; }
    .account-item[data-badge="offline"] .avatar::after { background: #ff3b30; }
    .account-item[data-badge="loadfail"] .avatar::after { background: #ff3b30; }
    /* v3.0.3: 后台生成中转圈 / 回复完成标记 */
    .account-item[data-busy="1"] .avatar::before {
      content: ''; position: absolute; inset: -3px;
      border-radius: 50%;
      border: 2px solid #1d63d8; border-top-color: transparent;
      animation: accspin .9s linear infinite;
    }
    @keyframes accspin { to { transform: rotate(360deg); } }
    .account-item[data-done="1"] { background: #fff6e5; border-color: #ffd9a0; }
    /* v3.0.5: 名字旁边的套餐小字 */
    .plan-tag {
      font-size: 9px; line-height: 14px; padding: 0 4px;
      border-radius: 4px; white-space: nowrap; flex-shrink: 0;
      background: #f3edff; color: #6941c6; border: 1px solid #e0d4ff;
      max-width: 66px; overflow: hidden; text-overflow: ellipsis;
    }
    .done-tag {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      background: #ff3b30; color: #fff; white-space: nowrap;
      animation: breathe 1.6s ease-in-out infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .acc-name {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .account-item:hover { background: #f0f0f4; }
    .account-item.active { background: #e8f1fe; border-color: #1d63d8; color: #0c3f96; }
    .badge {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      background: #e6f4ea; color: #1e7e34; white-space: nowrap;
    }
    .badge.pending { background: #fff3cd; color: #8a6d1a; }
    .badge.offline, .badge.loadfail { background: #fdecea; color: #b3261e; }
    .del {
      color: #c0392b; font-size: 12px; border: none; background: none;
      cursor: pointer; visibility: hidden; padding: 2px 6px;
    }
    .account-item:hover .del { visibility: visible; }
    .empty-tip { color: #86868b; font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.8; }
    .sidebar-footer { border-top: 1px solid #eeeef2; padding: 10px 14px 12px; }
    .author-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 2px 8px; font-size: 11px; color: #86868b;
    }
    .pref-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #515154; cursor: pointer;
    }
    /* 双击就地编辑 */
    .inline-edit {
      width: 100%; min-width: 0;
      font: inherit; font-size: 13px;
      padding: 2px 6px;
      border: 1px solid #1d63d8; border-radius: 6px;
      outline: none; background: #fff; color: #1d1d1f;
    }
    .main-area { flex: 1; position: relative; background: #eceef2; }
    .main-tip {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; gap: 8px;
      align-items: center; justify-content: center;
      color: #86868b; font-size: 13px; pointer-events: none;
    }
    .toast-wrap { position: fixed; left: 12px; right: auto; bottom: 12px; width: 236px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: rgba(28,28,32,.92); color: #fff; font-size: 12px;
      padding: 10px 14px; border-radius: 10px; max-width: 100%;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 16px rgba(0,0,0,.25); cursor: default;
      animation: fadein .2s ease;
    }
    .toast b { cursor: pointer; text-decoration: underline; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* v3.0.15: 顶部版本按钮 + 检查更新弹窗 */
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ver-btn {
      font-size: 10px; line-height: 16px; padding: 0 7px; border-radius: 9px;
      background: #f0f0f4; color: #515154; border: 1px solid #e3e3e8;
      cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0;
    }
    .ver-btn:hover { background: #e8f1fe; color: #1d63d8; border-color: #c5d9f7; }
    .ver-btn.has-new { background: #ff3b30; border-color: #ff3b30; color: #fff; }
    .mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.28);
      display: flex; align-items: center; justify-content: center; z-index: 200;
    }
    .mask[hidden] { display: none; }
    .modal {
      width: 380px; background: #fff; border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.22); overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid #eeeef2;
      font-size: 14px; font-weight: 600; color: #1d1d1f;
    }
    .modal-x {
      border: none; background: none; font-size: 16px; line-height: 1;
      color: #86868b; cursor: pointer; padding: 0 2px;
    }
    .modal-x:hover { color: #1d1d1f; }
    .modal-body { padding: 14px 16px 6px; font-size: 12px; color: #515154; }
    .upd-row { display: flex; justify-content: space-between; padding: 4px 0; }
    .upd-row b { font-weight: 600; color: #1d1d1f; }
    .upd-notes {
      margin-top: 10px; padding: 9px 10px; background: #f7f7f9; border-radius: 8px;
      max-height: 140px; overflow-y: auto; white-space: pre-wrap; line-height: 1.55;
      font-size: 11px; color: #515154; user-select: text;
    }
    .upd-notes[hidden] { display: none; }
    .upd-bar { margin-top: 12px; height: 6px; background: #eeeef2; border-radius: 3px; overflow: hidden; }
    .upd-bar[hidden] { display: none; }
    .upd-bar i { display: block; height: 100%; width: 0; background: #1d63d8; transition: width .2s; }
    .upd-msg { margin-top: 8px; font-size: 11px; color: #86868b; min-height: 17px; line-height: 1.5; }
    .upd-msg.err { color: #b3261e; }
    .modal-foot { display: flex; gap: 8px; padding: 12px 16px 14px; }
    .mbtn {
      flex: 1; padding: 8px 0; border-radius: 8px; font-size: 12px; cursor: pointer;
      border: 1px solid #d8d8dd; background: #fff; color: #515154; font-family: inherit;
    }
    .mbtn:hover:not(:disabled) { background: #f7f7f9; }
    .mbtn.primary { background: #1d63d8; border-color: #1d63d8; color: #fff; font-weight: 500; }
    .mbtn.primary:hover:not(:disabled) { background: #174ec0; }
    .mbtn:disabled { opacity: .55; cursor: default; }
    .upd-src { padding: 0 16px 14px; display: flex; gap: 6px; }
    .upd-src[hidden] { display: none; }
    .upd-src input {
      flex: 1; min-width: 0; font: inherit; font-size: 11px; padding: 6px 8px;
      border: 1px solid #d8d8dd; border-radius: 6px; outline: none;
      color: #1d1d1f; user-select: text;
    }
    .upd-src input:focus { border-color: #1d63d8; }
    .upd-src .mbtn { flex: 0 0 56px; padding: 6px 0; }
    /* v4.2: 设置弹窗 */
    .set-label { font-size: 12px; color: #1d1d1f; font-weight: 500; margin-bottom: 7px; }
    .set-path { display: flex; gap: 6px; align-items: stretch; }
    .set-path input {
      flex: 1; min-width: 0; padding: 7px 9px; font-size: 11px;
      border: 1px solid #d8d8dd; border-radius: 8px; background: #fafafb;
      color: #515154; font-family: inherit; outline: none;
    }
    .set-path .mbtn { flex: 0 0 62px; padding: 0; }
    .set-hint { margin: 9px 0 2px; font-size: 11px; color: #86868b; line-height: 1.65; }
    .set-hint code { background: #f0f0f4; padding: 1px 4px; border-radius: 4px; font-size: 11px; }
    .set-check {
      display: flex; align-items: flex-start; gap: 7px;
      margin-top: 14px; padding-top: 13px; border-top: 1px solid #eeeef2;
      font-size: 12px; color: #515154; line-height: 1.5; cursor: pointer;
    }
    .set-check input { margin: 2px 0 0; flex: 0 0 auto; }
    .set-check b { color: #b3261e; font-weight: 600; }
    .set-warn {
      margin-bottom: 12px; padding: 9px 11px; border-radius: 8px;
      background: #fdecea; border: 1px solid #f5c6c2;
      color: #b3261e; font-size: 12px; line-height: 1.6;
    }
    .set-warn[hidden] { display: none; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <h1>豆包多开管理器</h1>
        <button class="ver-btn" id="btnUpdate" title="检查更新">测试版v—</button>
      </div>
    </div>
    <button class="btn-add" id="btnAdd">＋ 添加账号（在右侧页面直接扫码）</button>
    <button class="btn-check" id="btnCheckAll" title="逐个检查所有账号的登录凭证，自动修正侧栏在线状态">⟳ 检测账号状态</button>
    <div class="account-list" id="accountList"></div>
    <div class="sidebar-footer">
      <div class="author-row">
        <span>作者：杂粮煎饼</span>
      </div>
      <div class="pref-row">
        <a href="#" id="lnkDl" style="color:#1d63d8;">打开下载目录</a>
      </div>
    </div>
  </aside>
  <div class="main-area">
    <div class="main-tip" id="mainTip">
      <div style="font-size:34px;">🐋</div>
      <div>点击左侧账号切换；＋添加账号后在右侧直接扫码登录</div>
      <div style="font-size:11px;color:#b0b0b6;">Ctrl+1~9 快速切号 · 双击名称就地改名</div>
    </div>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="mask" id="updMask" hidden tabindex="-1">
    <div class="modal">
      <div class="modal-head">
        <span id="updTitle">检查更新</span>
        <button class="modal-x" id="updClose" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="upd-row"><span>当前版本</span><b id="updCur">—</b></div>
        <div class="upd-row"><span>最新版本</span><b id="updNew">检测中…</b></div>
        <div class="upd-notes" id="updNotes" hidden></div>
        <div class="upd-bar" id="updBarWrap" hidden><i id="updBar"></i></div>
        <div class="upd-msg" id="updMsg"></div>
      </div>
      <div class="modal-foot">
        <button class="mbtn" id="updSource">更新源</button>
        <button class="mbtn primary" id="updAction" disabled>检测中…</button>
      </div>
      <div class="upd-src" id="updSrcBox" hidden>
        <input id="updSrcInput" placeholder="留空 = GitHub Releases；只填域名即可，如 https://example.com（自动补 /latest.json）" spellcheck="false">
        <button class="mbtn" id="updSrcSave">保存</button>
      </div>
    </div>
  </div>

  <!-- v4.2: 设置弹窗(与更新弹窗同一套遮挡处理: 打开时隐藏豆包视图) -->
  <div class="mask" id="setMask" hidden tabindex="-1">
    <div class="modal">
      <div class="modal-head">
        <span>设置</span>
        <button class="modal-x" id="setClose" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="set-warn" id="setWarn" hidden></div>
        <div class="set-label">下载保存位置</div>
        <div class="set-path">
          <input id="setDlPath" readonly title="当前下载目录">
          <button class="mbtn" id="setBrowse">浏览…</button>
        </div>
        <p class="set-hint" id="setDlHint">所有账号下载的文件都直接存进这个文件夹，不再新建子文件夹。<br>留空则使用系统「下载」文件夹。</p>
        <label class="set-check">
          <input type="checkbox" id="setCloseExit">
          <span>点右上角关闭时<b>直接退出程序</b>（不勾选则最小化到托盘）</span>
        </label>
      </div>
      <div class="modal-foot">
        <button class="mbtn" id="setReset">恢复默认</button>
        <button class="mbtn primary" id="setSave">保存</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
