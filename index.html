<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>豆包多开管理器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      overflow: hidden;
      user-select: none;
    }
    .sidebar {
      width: 260px; min-width: 260px;
      background: #fff;
      border-right: 1px solid #e3e3e8;
      display: flex; flex-direction: column;
      height: 100vh;
    }
    .sidebar-header { padding: 14px 14px 10px; border-bottom: 1px solid #eeeef2; }
    .sidebar-header h1 { font-size: 15px; font-weight: 600; }
    .sidebar-header p { font-size: 11px; color: #86868b; margin-top: 3px; }
    .btn-add {
      margin: 12px 14px 6px; padding: 9px 0;
      background: #1d63d8; color: #fff; border: none; border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }
    .btn-add:hover { background: #174ec0; }
    .btn-add:disabled { background: #b8b8be; cursor: wait; }
    .btn-check {
      margin: 0 14px 8px; padding: 7px 0;
      width: calc(100% - 28px);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      background: #fff; color: #1d63d8;
      border: 1px solid #c5d9f7; border-radius: 8px;
      font-size: 12px; cursor: pointer;
    }
    .btn-check:hover { background: #f2f7ff; }
    .btn-check:disabled { color: #b8b8be; border-color: #e3e3e8; background: #fafafa; cursor: wait; }
    .account-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .account-item {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 10px; margin: 3px 0;
      border-radius: 8px; font-size: 13px; cursor: pointer;
      background: #f7f7f9; border: 1px solid transparent;
    }
    .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      flex-shrink: 0; position: relative;
    }
    .avatar::after {
      content: ''; position: absolute; right: -1px; bottom: -1px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #c7c7cc; border: 2px solid #fff;
    }
    .account-item[data-badge="online"] .avatar::after { background: #34c759; }
    .account-item[data-badge="pending"] .avatar::after { background: #ff9f0a; }
    .account-item[data-badge="offline"] .avatar::after { background: #ff3b30; }
    .account-item[data-badge="loadfail"] .avatar::after { background: #ff3b30; }
    /* v3.0.3: 后台生成中转圈 / 回复完成标记 */
    .account-item[data-busy="1"] .avatar::before {
      content: ''; position: absolute; inset: -3px;
      border-radius: 50%;
      border: 2px solid #1d63d8; border-top-color: transparent;
      animation: accspin .9s linear infinite;
    }
    @keyframes accspin { to { transform: rotate(360deg); } }
    .account-item[data-done="1"] { background: #fff6e5; border-color: #ffd9a0; }
    /* v3.0.5: 名字旁边的套餐小字 */
    .plan-tag {
      font-size: 9px; line-height: 14px; padding: 0 4px;
      border-radius: 4px; white-space: nowrap; flex-shrink: 0;
      background: #f3edff; color: #6941c6; border: 1px solid #e0d4ff;
      max-width: 66px; overflow: hidden; text-overflow: ellipsis;
    }
    .done-tag {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      background: #ff3b30; color: #fff; white-space: nowrap;
      animation: breathe 1.6s ease-in-out infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .acc-name {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .account-item:hover { background: #f0f0f4; }
    .account-item.active { background: #e8f1fe; border-color: #1d63d8; color: #0c3f96; }
    .badge {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      background: #e6f4ea; color: #1e7e34; white-space: nowrap;
    }
    .badge.pending { background: #fff3cd; color: #8a6d1a; }
    .badge.offline, .badge.loadfail { background: #fdecea; color: #b3261e; }
    .del {
      color: #c0392b; font-size: 12px; border: none; background: none;
      cursor: pointer; visibility: hidden; padding: 2px 6px;
    }
    .account-item:hover .del { visibility: visible; }
    .empty-tip { color: #86868b; font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.8; }
    .sidebar-footer { border-top: 1px solid #eeeef2; padding: 10px 14px 12px; }
    .author-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 2px 8px; font-size: 11px; color: #86868b;
    }
    .pref-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #515154; cursor: pointer;
    }
    /* 双击就地编辑 */
    .inline-edit {
      width: 100%; min-width: 0;
      font: inherit; font-size: 13px;
      padding: 2px 6px;
      border: 1px solid #1d63d8; border-radius: 6px;
      outline: none; background: #fff; color: #1d1d1f;
    }
    .main-area { flex: 1; position: relative; background: #eceef2; }
    .main-tip {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; gap: 8px;
      align-items: center; justify-content: center;
      color: #86868b; font-size: 13px; pointer-events: none;
    }
    .toast-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: rgba(28,28,32,.92); color: #fff; font-size: 12px;
      padding: 10px 14px; border-radius: 10px; max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25); cursor: default;
      animation: fadein .2s ease;
    }
    .toast b { cursor: pointer; text-decoration: underline; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>豆包多开管理器</h1>
      <p>v3 · 视图池 · 毫秒级切号</p>
    </div>
    <button class="btn-add" id="btnAdd">＋ 添加账号（在右侧页面直接扫码）</button>
    <button class="btn-check" id="btnCheckAll" title="逐个检查所有账号的登录凭证，自动修正侧栏在线状态">⟳ 检测账号状态</button>
    <div class="account-list" id="accountList"></div>
    <div class="sidebar-footer">
      <div class="author-row">
        <span>作者：杂粮煎饼</span>
      </div>
      <label class="pref-row">
        <input type="checkbox" id="chkTray"> 关闭按钮最小化到托盘
        &nbsp;·&nbsp;<a href="#" id="lnkDl" style="color:#1d63d8;">下载目录</a>
      </label>
    </div>
  </aside>
  <div class="main-area">
    <div class="main-tip" id="mainTip">
      <div style="font-size:34px;">🐋</div>
      <div>点击左侧账号切换；＋添加账号后在右侧直接扫码登录</div>
      <div style="font-size:11px;color:#b0b0b6;">Ctrl+1~9 快速切号 · 双击名称就地改名</div>
    </div>
  </div>
  <div class="toast-wrap" id="toastWrap"></div>
  <script src="renderer.js"></script>
</body>
</html>
